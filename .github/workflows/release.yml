name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: release validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --extra dev --locked

      - name: Validate tag version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(uv run python -c 'from importlib.metadata import version; print(version("opencontextengine"))')"
          if [[ "${project_version}" != "${tag_version}" ]]; then
            echo "pyproject version ${project_version} does not match tag ${tag_version}"
            exit 1
          fi

      - name: Run unit tests (one process per file)
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            echo "::group::pytest ${file}"
            if ! uv run pytest "${file}" -q; then
              failed=1
              echo "::error file=${file}::unit tests failed"
            fi
            echo "::endgroup::"
          done < <(find tests/unit -name 'test_*.py' -print0 | sort -z)
          exit "${failed}"

  python-package:
    name: publish Python package
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: publish Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}