[alembic]
# Migration scripts ship inside the wheel (src/oce/alembic), shared by `oce serve` and dev.
# Keep this file ASCII: alembic reads it with the locale encoding on Windows.
script_location = src/oce/alembic
prepend_sys_path = src
sqlalchemy.url = postgresql+asyncpg://oce:oce@localhost:5432/oce

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
