# 本地评测 profile —— 零外部依赖、零密钥，一条命令可跑。
#
#   oce bench serve --profile local --tag dev --port 8987
#   oce bench run   --base-url http://127.0.0.1:8987 --repo <path>
#
# 存储：SQLite（元数据）+ Milvus Lite（向量，本地文件），都落在 <data-dir> 下。
# worker 关闭 -> batch_upload 同步嵌入（service.batch_upload 见 background_indexing
# 为假时内联 EmbedPendingCommand），因此无需 Redis / Postgres / 后台 worker。
#
# 【只写与默认值不同的键】sqlite+aiosqlite / milvus lite / 127.0.0.1:8987 /
# worker 关 / 嵌入端点 http://127.0.0.1:8994/v1/embeddings f2llm-v2-0.6b 1024 维等
# 全部是 dataclass 默认（见 profiles.py），不写即隐式注入。serve 关断 cwd .env
# （见 apply_profile -> _disable_settings_dotenv），凭据只从 secrets.env / 真实 env
# 进来；本文件零密钥字段，嵌入 key 缺省回落 settings 默认 sk-oce-llama-server。
#
# 【pipeline 段是唯一例外】：只注入写出的键，未写键走 settings.py 默认。
# 评测口径参数（top_k / final_select_k / rrf_k）显式钉住——跨版本默认值漂移不得
# 悄悄改变分数可比性；组件开关只钉与 settings 默认不同的（意图分类/查询分解默认开）。

[backend]
db_path = "{data_dir}/oce_bench.db"
milvus_path = "{data_dir}/oce_bench_milvus.db"

[isolation]
collection_prefix = "bench_local"
queue_template = "oce:bench_local_{tag}"

[service]
worker_concurrency = 4

[embedding]
max_concurrency = 4
max_batch_size = 32

[pipeline]
default_top_k = 30
final_select_k = 10
rrf_k = 60
query_decomposition_enabled = false
intent_classification_enabled = false
